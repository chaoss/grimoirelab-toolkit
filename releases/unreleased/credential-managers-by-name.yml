---
title: Credential managers created by name
category: added
author: Santiago Dueñas <sduenas@grimoirelab.org>
issue: null
notes: >
  Applications can support every credential manager without
  knowing the details of each one. `available_managers()`
  returns a description of each manager, including its
  configuration parameters, and `create_credential_manager()`
  creates a manager by its name. The descriptions are obtained
  from the constructors of the subclasses of `CredentialManager`
  that set their own `NAME`, so new managers are available to applications
  as soon as they are defined.
