[tool.poetry]
name = "grimoirelab-toolkit"
version = "1.2.10"
description = "Toolkit of common functions used across GrimoireLab"
authors = [
    "GrimoireLab Developers"
]
license = "GPL-3.0+"

readme = "README.md"

homepage = "https://chaoss.github.io/grimoirelab/"
repository = "https://github.com/chaoss/grimoirelab-toolkit"

keywords = [
    "development",
    "grimoirelab"
]

packages = [
    { include = "grimoirelab_toolkit" },
    { include = "tests", format = "sdist" },
]

include = [
    { path = "AUTHORS", format = "sdist" },
    { path = "NEWS", format = "sdist" },
    { path = "README.md", format = "sdist" },
]

classifiers = [
   "Development Status :: 5 - Production/Stable",
   "Intended Audience :: Developers",
   "Topic :: Software Development",
   "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
   "Programming Language :: Python :: 3"
]

[tool.poetry.dependencies]
python = "^3.10"
python-dateutil = "^2.8.2"
hvac = { version = "^2.3.0", optional = true }

[tool.poetry.extras]
hashicorp-manager = ["hvac"]

[tool.poetry.group.dev.dependencies]
coverage = "^7.2.3"
ruff = "^0.17.3"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "__pypackages__",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "docs",
    "docker",
    "site-packages",
]